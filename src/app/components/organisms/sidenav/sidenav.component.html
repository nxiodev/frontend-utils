<mat-sidenav-container class="sidenav-container">
  <!-- Sidenav controlado por el servicio -->
  <mat-sidenav #sidenav [mode]="isMobile ? 'over' : 'side'" [(opened)]="isSidenavOpen" >
    <app-universal-icon [class]="'fa-solid fa-bars'" class="centradoSinMargen" (click)="toggleSidenav()"></app-universal-icon>
    <div *ngFor="let link of links" class="marginLink">

<!--      { url: '/descriptions?button', name: '', icon: 'fa-solid fa-bars' },-->
      <a
        mat-list-item
        *ngIf="link.icon"
        class="quitarLinkIcono"
        [routerLink]="link.url"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="onLinkClick()"
      >
        <app-universal-icon *ngIf="link.icon" [class]="link.icon" class="centrado"></app-universal-icon>
        <span>{{ link.name }}</span>
      </a>

      <a
        mat-list-item
        *ngIf="!link.icon && link.url"
        class="quitarLinkNormal"
        [routerLink]="link.url"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="onLinkClick()"
      >
        {{ link.name }}
      </a>
    </div>

  </mat-sidenav>
  <mat-sidenav-content class="main-content">
    <!-- Botón para abrir/cerrar sidenav -->
      <div class="ColorFondoMorado">
        <div class="botonPequeño">
          <app-universal-icon [class]="'fa-solid fa-bars'" class="iconoMenu" (click)="toggleSidenav()"></app-universal-icon>
        </div>
      </div>
    <div class="content">
      <ng-content></ng-content>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
