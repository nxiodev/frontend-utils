<app-login-container [LoginTitle]="LoginTitle" [LoginSubtitle]="LoginSubtitle">
  <app-login-inputs (credentialsEntered)="onCredentialsEntered($event)"></app-login-inputs>
  <app-login-actions (signInClicked)="onSignInClicked()" style="width: 50%"></app-login-actions>
  <app-login-icons></app-login-icons>
</app-login-container>
